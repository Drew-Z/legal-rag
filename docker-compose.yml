services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["pgvector"]
    environment:
      POSTGRES_DB: legal_rag
      POSTGRES_USER: legal_rag
      POSTGRES_PASSWORD: legal_rag
    ports:
      - "5432:5432"
    volumes:
      - legal_rag_pg:/var/lib/postgresql/data

volumes:
  legal_rag_pg:
