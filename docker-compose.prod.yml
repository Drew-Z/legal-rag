services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legal_rag
      POSTGRES_USER: legal_rag
      POSTGRES_PASSWORD: legal_rag
    volumes:
      - legal_rag_prod_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_rag -d legal_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    environment:
      PORT: 4000
      WEB_ORIGIN: http://localhost:8080
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      VECTOR_STORE: ${VECTOR_STORE:-pgvector}
      DATABASE_URL: postgresql://legal_rag:legal_rag@postgres:5432/legal_rag
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-thinking}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen3-Embedding-0.6B}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_EMAIL: ${AUTH_EMAIL:-demo@legal-rag.local}
      AUTH_NAME: ${AUTH_NAME:-演示用户}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-8}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  legal_rag_prod_pg:
