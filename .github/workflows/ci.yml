name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm --workspace apps/api run test:unit

      - name: API validation
        run: npm --workspace apps/api run validate

      - name: RAG evaluation
        run: npm --workspace apps/api run evaluate

      - name: Contract review evaluation
        run: npm --workspace apps/api run evaluate:review

      - name: Build
        run: npm run build

      - name: Docker compose config
        run: docker compose -f docker-compose.prod.yml config
